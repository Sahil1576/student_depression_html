<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Depression Predictor</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="wrapper">
    <header class="header">
      <h1>Student Depression Predictor</h1>
      <p>Fill in the details below to get a prediction from the model.</p>
    </header>

    <form id="predictForm" class="card">

      <div class="grid">

        <div class="field">
          <label for="gender">Gender</label>
          <select id="gender" name="gender" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <div class="field">
          <label for="age">Age</label>
          <input type="number" id="age" name="age" min="18" value="18" required />
        </div>

        <div class="field">
          <label for="city">City</label>
          <select id="city" name="city" required></select>
        </div>

        <div class="field">
          <label for="academic_pressure">Academic Pressure (0-5)</label>
          <input type="number" id="academic_pressure" name="academic_pressure" min="0" max="5" value="1" required />
        </div>

        <div class="field">
          <label for="cgpa">CGPA (2-10)</label>
          <input type="number" id="cgpa" name="cgpa" min="2.01" max="10" step="0.01" value="8.0" required />
        </div>

        <div class="field">
          <label for="study_satisfaction">Study Satisfaction (0-5)</label>
          <input type="number" id="study_satisfaction" name="study_satisfaction" min="0" max="5" value="4" required />
        </div>

        <div class="field">
          <label for="sleep_duration">Sleep Duration</label>
          <select id="sleep_duration" name="sleep_duration" required></select>
        </div>

        <div class="field">
          <label for="dietary_habits">Dietary Habits</label>
          <select id="dietary_habits" name="dietary_habits" required></select>
        </div>

        <div class="field">
          <label for="degree">Degree</label>
          <select id="degree" name="degree" required></select>
        </div>

        <div class="field">
          <label for="suicidal_thoughts">Have you ever had suicidal thoughts?</label>
          <select id="suicidal_thoughts" name="suicidal_thoughts" required>
            <option value="No">No</option>
            <option value="Yes">Yes</option>
          </select>
        </div>

        <div class="field">
          <label for="work_study_hours">Work/Study Hours (0-12)</label>
          <input type="number" id="work_study_hours" name="work_study_hours" min="0" max="12" value="3" required />
        </div>

        <div class="field">
          <label for="financial_stress">Financial Stress (1-5)</label>
          <input type="number" id="financial_stress" name="financial_stress" min="1" max="5" value="2" required />
        </div>

        <div class="field">
          <label for="family_history_of_mental_illeness">Family History of Mental Illness</label>
          <select id="family_history_of_mental_illeness" name="family_history_of_mental_illeness" required>
            <option value="No">No</option>
            <option value="Yes">Yes</option>
          </select>
        </div>

      </div>

      <div class="actions">
        <label for="apiUrl" class="api-label">API base URL</label>
        <input type="text" id="apiUrl" value="http://127.0.0.1:8000" />
        <button type="submit" id="submitBtn">Predict</button>
      </div>
    </form>

    <div id="result" class="result hidden"></div>
    <pre id="jsonOutput" class="json-output hidden"></pre>
  </div>

  <script src="script.js"></script>
</body>
</html>
